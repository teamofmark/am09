<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>plugin(JQuery) - bxslider</title>
    <!-- 
        ? 플러그-인(plug-in) : "사용하기가 쉬움" 이라는 의미. - why? 시간이없거나 or 만들능력이없거나
        * 1. 환경마다 다름 - ex> JQuery plugin, react plugin, vue plugin, java plugin....
        * 2. 관리여부를 판단 - official Web(공식사이트) or git등의 sourceControl 이 존재하는가.
        * 3. 완성도 판단 - 1. 샘플-구조화 2. 샘플-스타일 3. 샘플-스크립트
        ! 남이 만들어 놓은 것이기 때문에 customize자체가 굉장히 까다로움.
        ! 너무 남발하면(여러개) 곤란해짐...= 장르별 1개(ex> slider x1, imgGallery x1...)
    -->
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="js/jquery.bxslider.js"></script>
    <!-- <script src="vendor/jquery.easing.1.3.js"></script> -->
    <script src="vendor/jquery.fitvids.js"></script>
    <script src="js/customize.bxslider.js"></script>
    <link rel="stylesheet" href="css/import.css">
</head>
<body>
    <ul class="bxslider">
        <li><img src="images/wallpaper1.jpg" alt="high Quality Wallpaper1" title="high Quality Wallpaper1"></li>
        <li><img src="images/wallpaper2.jpg" alt="high Quality Wallpaper2" title="high Quality Wallpaper2"></li>
        <li><img src="images/wallpaper3.jpg" alt="high Quality Wallpaper3" title="high Quality Wallpaper3"></li>
        <li><img src="images/wallpaper4.jpg" alt="high Quality Wallpaper4" title="high Quality Wallpaper4"></li>
        <li><iframe width="560" height="315" src="https://www.youtube.com/embed/uC-jGql0oD8?si=fx26cBYxW_ENUppD" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></li>
    </ul>
    <div class="newPager"></div>
</body>
</html>
