<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border style</title>
    <link rel="stylesheet" href="css/4_border.css">
</head>
<body>
    <div class="singleBox">동일한 굵기,형태,색상 테두리 박스.</div>
    <div class="multiBox">각기 다른 굵기,형태,색상 테두리 박스.</div>
    <div class="grooveBox">안 쪽 음영 테두리 박스.</div>
    <div class="ridgeBox">바깥 쪽 음영 테두리 박스.</div>
    <div class="insetBox">들어가 보이는 테두리 박스.</div>
    <div class="outsetBox">튀어나와 보이는 테두리 박스.</div>
    <div class="radiusBox">굴곡도 테두리 박스.</div>
    <div class="circleBox">원으로 바뀐 박스.</div>
</body>
</html>
